<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drawing Capture</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #ffb6c1 url('background.png') center / cover no-repeat;
      overflow: hidden;
      font-family: -apple-system, sans-serif;
    }
    #drawing {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain; /* keeps the drawing's proportions */
    }
    #hint {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(80vw, 360px);
      pointer-events: none; /* taps pass through to the page */
    }
    #hint img {
      width: 100%;
      display: block;
    }
    #hint p {
      position: absolute;
      inset: 0;
      margin: 0;
      padding: 14%;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: black;
      font-family: 'Marker Felt', 'Bradley Hand', 'Segoe Print', cursive;
      font-size: clamp(16px, 5vw, 24px);
    }
    #controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    button {
      font-size: 18px;
      padding: 14px 24px;
      border: none;
      border-radius: 10px;
      background: #ff69b4;
      color: white;
    }
    #sliderWrap {
      display: none;
      width: 80%;
      color: black;
      text-align: center;
      font-size: 14px;
    }
    #slider { width: 100%; }
    #buttons {
      display: flex;
      gap: 12px;
    }
    #creature {
      position: fixed;
      top: 0;
      left: 0;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="drawing"></canvas>
  <canvas id="creature" hidden></canvas>
  <div id="hint">
    <img src="stickynote.png" alt="">
    <p>Take a picture of a drawing on white paper, then watch it come to life!</p>
  </div>

  <div id="controls">
    <div id="sliderWrap">
      Sensitivity (raise it if lines are missing, lower it if the paper shows up)
      <input type="range" id="slider" min="1" max="100" value="50">
    </div>

    <!-- Both buttons sit side by side in this row -->
    <div id="buttons">
      <button id="takeBtn">📸 Take photo</button>
      <button id="doneBtn" hidden>✅ Done</button>
    </div>
  </div>

  <input type="file" id="fileInput" accept="image/*" capture="environment" hidden>

  <script src="sketch.js?v=6"></script>
</body>
</html>
