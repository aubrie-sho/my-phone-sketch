<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drawing Capture</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #ffb6c1;
      overflow: hidden;
      font-family: -apple-system, sans-serif;
    }
    #drawing {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain; /* keeps the drawing's proportions */
      z-index: 2;          /* sits above the waddling drawings while you edit */
    }
    .creature {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 50% 100%; /* pivot from the "feet" */
      pointer-events: none;
      z-index: 1;
    }
    #world {
      position: absolute;
      top: 0;
      left: 0;
      background: #ffb6c1 url('background.png') center / cover no-repeat;
      pointer-events: none; /* touches pass through to touchLayer */
      z-index: 0;
      will-change: transform;
    }
    #hint {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(80vw, 360px);
      pointer-events: none; /* taps pass through to the page */
      z-index: 2;
    }
    #hint img {
      width: 100%;
      display: block;
    }
    #hint p {
      position: absolute;
      inset: 0;
      margin: 0;
      padding: 14%;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: black;
      font-family: 'Marker Felt', 'Bradley Hand', 'Segoe Print', cursive;
      font-size: clamp(16px, 5vw, 24px);
    }
    #controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      z-index: 3;
    }
    button {
      font-size: 18px;
      padding: 14px 24px;
      border: none;
      border-radius: 10px;
      background: #ff69b4;
      color: white;
    }
    #sliderWrap {
      display: none;
      width: 80%;
      color: black;
      text-align: center;
      font-size: 14px;
    }
    #slider { width: 100%; }
    #buttons {
      display: flex;
      gap: 12px;
    }
    #touchLayer {
      position: fixed;
     inset: 0;
      touch-action: none; /* stops Safari from scrolling or zooming while you hold */
      -webkit-user-select: none;
     user-select: none;
      -webkit-touch-callout: none;
      z-index: 0;
    }
    #colorPicker {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: calc(16px + env(safe-area-inset-top)) 16px 16px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      z-index: 4; /* above the controls so it can't be missed */
    }
    #colorPicker[hidden] { display: none; }
    #colorPicker h2 {
      margin: 0;
      text-align: center;
      color: black;
      font-family: 'Marker Felt', 'Bradley Hand', 'Segoe Print', cursive;
      font-size: clamp(16px, 5vw, 24px);
      font-weight: normal;
    }
    #colorButtons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 400px;
    }
    #colorButtons button {
      padding: 12px 0;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="touchLayer"></div>
  <div id="world"></div>
  <canvas id="drawing"></canvas>

  <div id="hint">
    <img src="stickynote.png" alt="">
    <p>Take a picture of a drawing on white paper, then watch it come to life!</p>
  </div>

  <div id="controls">
    <div id="sliderWrap">
      Sensitivity (raise it if lines are missing, lower it if the paper shows up)
      <input type="range" id="slider" min="1" max="100" value="50">
    </div>

  <div id="colorPicker" hidden>
    <h2>What color did you draw it?</h2>
    <div id="colorButtons">
      <button data-color="black" style="background:#000">Black</button>
      <button data-color="red" style="background:#e53935">Red</button>
      <button data-color="green" style="background:#43a047">Green</button>
      <button data-color="blue" style="background:#1e88e5">Blue</button>
    </div>
  </div>

    <div id="buttons">
      <button id="takeBtn">📸 Take photo</button>
      <button id="doneBtn" hidden>✅ Done</button>
      <button id="addBtn" hidden>➕ Add drawing</button>
    </div>
  </div>

  <input type="file" id="fileInput" accept="image/*" capture="environment" hidden>

  <script src="sketch.js?v=12"></script>
</body>
</html>
