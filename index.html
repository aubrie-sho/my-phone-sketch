<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Drawing Capture</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #ffb6c1;
      overflow: hidden;
      font-family: -apple-system, sans-serif;
    }
    html { background: #ffb6c1; }

    /* When the phone reports portrait, JS sets this class and rotates the whole page */
    body.rotated {
      position: fixed;
      top: 0;
      left: 0;
      transform-origin: 0 0;
    }
    /* Safe-area insets refer to the portrait screen, so use plain padding while rotated */
    body.rotated #controls { padding: 14px 16px; }
    body.rotated #tools { left: 14px; }
    body.rotated #colorPicker { padding: 14px 16px; }
    body.rotated #instructions { right: 14px; }


    #drawing {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain; /* keeps the drawing's proportions */
      z-index: 2;          /* sits above the waddling drawings while you edit */
    }
    .creature {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 50% 100%; /* pivot from the "feet" */
      pointer-events: none;
      z-index: 1;
    }
    #world {
      position: absolute;
      top: 0;
      left: 0;
      background: #ffb6c1 center / 100% 100% no-repeat;
      pointer-events: none; /* touches pass through to touchLayer */
      z-index: 0;
      will-change: transform;
    }

    #controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 10px calc(16px + env(safe-area-inset-right))
              calc(10px + env(safe-area-inset-bottom))
              calc(16px + env(safe-area-inset-left));
      display: flex;
      flex-direction: row;       /* slider and buttons side by side */
      align-items: flex-end;     /* keeps the buttons from shifting when the slider appears */
      justify-content: center;
      gap: 20px;
      z-index: 3;
    }
    button {
      font-size: 22px;
      padding: 16px 28px;
      border: none;
      border-radius: 14px;
      background: #ff69b4;
      color: white;
    }
    #sliderWrap {
      display: none;
      flex: 1 1 0;
      max-width: 420px;
      color: black;
      text-align: left;
      font-size: 16px;
    }
    #slider {
      width: 100%;
      height: 36px;
    }
    #buttons {
      display: flex;
      gap: 16px;
      flex-shrink: 0;
    }
    #touchLayer {
      position: fixed;
     inset: 0;
      touch-action: none; /* stops Safari from scrolling or zooming while you hold */
      -webkit-user-select: none;
     user-select: none;
      -webkit-touch-callout: none;
      z-index: 0;
    }
    #colorPicker {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: calc(10px + env(safe-area-inset-top))
              calc(16px + env(safe-area-inset-right)) 10px
              calc(16px + env(safe-area-inset-left));
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      z-index: 4; /* above the controls so it can't be missed */
    }
    #colorPicker[hidden] { display: none; }
    #colorPicker h2 {
      margin: 0;
      text-align: center;
      color: rgb(116, 80, 59);
      font-family: 'Marker Felt', 'Bradley Hand', 'Segoe Print', cursive;
      font-size: 28px;
      font-weight: normal;
    }
    #colorButtons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 560px;
    }
    #colorButtons button {
      padding: 14px 0;
      font-size: 20px;
    }
    #tools {
      position: fixed;
      left: calc(14px + env(safe-area-inset-left));
      top: 50%;
      transform: translateY(-50%);
      height: 75%;            /* resize the bar here */
      z-index: 3;
      pointer-events: none;   /* the empty bar doesn't block panning */
    }
    #toolsBg { display: block; height: 100%; width: auto; }
    #toolList {
      position: absolute;
      inset: 24% 12% 8% 12%;  /* keeps the buttons below the "TOOLS" title */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
    }
    #tools .tool {
      pointer-events: auto;   /* but the buttons still catch drags */
      min-width: 0;
      font-size: 16px;
      padding: 8px 10px;
    }
    #tools[hidden] { display: none; }
    .tool {
      min-width: 96px;
      font-size: 22px;
      padding: 18px 28px;
      border-radius: 14px;
      background: #ff69b4;
      color: white;
      text-align: center;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    .tool.dragging { opacity: 0.4; }  /* the slot dims while you carry its ghost */
    .tool-ghost {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 5;
    }
    
    .heart {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 1;
      color: #e0245e;
      font-family: 'Marker Felt', 'Bradley Hand', 'Segoe Print', cursive;
      font-size: 20px;
    }
    #instructions {
      position: fixed;
      right: calc(14px + env(safe-area-inset-right));
      top: 50%;
      transform: translateY(-50%);
      height: 65%;            /* resize the clipboard here */
      pointer-events: none;   /* touches pass through so you can still pan */
      z-index: 3;
    }
    #instructions[hidden] { display: none; }
    #instructions img { display: block; height: 100%; width: auto; }

    /* Hide it while the color question is open so they don't overlap */
    body:has(#colorPicker:not([hidden])) #instructions { visibility: hidden; }

    #addBtn {
      background: none;
      padding: 0;
      border-radius: 0;
      -webkit-tap-highlight-color: transparent;
    }
    #addBtn img {
      display: block;
      height: 150px;   /* change this to resize the button */
      width: auto;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="touchLayer"></div>
  <div id="world"></div>
  <canvas id="drawing"></canvas>
  <div id="tools" hidden>
    <img id="toolsBg" src="ToolsBar.png" alt="">
    <div id="toolList">
      <div class="tool" data-tool="food">food</div>
      <div class="tool" data-tool="broom">broom</div>
      <div class="tool" data-tool="hand">hand</div>
    </div>
  </div>
  <div id="instructions" hidden>
    <img src="Instructions.png" alt="Instructions">
  </div>

  <div id="controls">
    <div id="sliderWrap">
      Sensitivity (raise it if lines are missing, lower it if the paper shows up)
      <input type="range" id="slider" min="1" max="100" value="50">
    </div>

  <div id="colorPicker" hidden>
    <h2>What color did you draw it?</h2>
    <div id="colorButtons">
      <button data-color="red" style="background:#e53935">Red</button>
      <button data-color="green" style="background:#43a047">Green</button>
      <button data-color="blue" style="background:#1e88e5">Blue</button>
      <button data-color="purple" style="background:#8e24aa">Purple</button>
    </div>
  </div>

  

    <div id="buttons">
      <button id="takeBtn">📸 Take photo</button>
      <button id="doneBtn" hidden>✅ Done</button>
      <button id="rotateBtn" hidden>↻ Rotate</button>
      <button id="addBtn" hidden aria-label="Add drawing"><img src="AddDrawing.png" alt=""></button>
    </div>
  </div>

  <input type="file" id="fileInput" accept="image/*" capture="environment" hidden>

  <script src="sketch.js?v=24"></script>
</body>
</html>
