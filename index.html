<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drawing Capture</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #ffb6c1; /* the pink background: change this later */
      overflow: hidden;
      font-family: -apple-system, sans-serif;
    }
    #drawing {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain; /* keeps the drawing's proportions */
    }
    #hint {
      position: fixed;
      top: 40%;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 20px;
      padding: 0 24px;
      box-sizing: border-box;
    }
    #controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    button {
      font-size: 18px;
      padding: 14px 24px;
      border: none;
      border-radius: 10px;
      background: #ff69b4;
      color: white;
    }
    #sliderWrap {
      display: none;
      width: 80%;
      color: white;
      text-align: center;
      font-size: 14px;
    }
    #slider { width: 100%; }
  </style>
</head>
<body>
  <canvas id="drawing"></canvas>
  <div id="hint">Take a photo of a drawing on white paper</div>

  <div id="controls">
    <div id="sliderWrap">
      Sensitivity (raise it if lines are missing, lower it if the paper shows up)
      <input type="range" id="slider" min="1" max="100" value="50">
    </div>
    <button id="takeBtn">📸 Take photo</button>
  </div>

  <input type="file" id="fileInput" accept="image/*" capture="environment" hidden>

  <script src="sketch.js?v=1"></script>
</body>
</html>
